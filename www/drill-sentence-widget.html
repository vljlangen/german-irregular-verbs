<div class="drill-sentence" data-tense="__TENSE__">
  <h4>__TITLE__</h4>
  <div class="sentence-setup">
    <p>Valitse verbiryhmä yleisyysjärjestyksen mukaan:</p>
    <div class="sentence-ranges drill-ranges"></div>
  </div>
  <div class="sentence-run" hidden>
    <p class="sentence-progress"></p>
    <p class="sentence-fi"></p>
    <div class="sentence-cloze" role="group" aria-label="Täydennettävä saksankielinen lause"></div>
    <div class="drill-feedback-space" aria-live="polite">
      <p class="sentence-feedback drill-feedback drill-hidden"></p>
    </div>
    <div class="drill-actions">
      <button type="button" class="sentence-submit primary">Tarkista</button>
      <button type="button" class="sentence-next" hidden>Seuraava lause</button>
      <button type="button" class="sentence-stop danger">Lopeta harjoitus</button>
    </div>
  </div>
  <div class="sentence-done" hidden>
    <h4>Yhteenveto</h4>
    <div class="sentence-summary"></div>
    <button type="button" class="sentence-restart">Valitse uusi väli</button>
  </div>
</div>
