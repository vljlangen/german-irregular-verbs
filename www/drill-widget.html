<div class="drill-heart">
  <h4>Harjoitus: teemamuodot</h4>
  <div class="drill-setup drill-panel active">
    <p>Valitse verbiryhmä yleisyysjärjestyksen mukaan:</p>
    <div class="drill-ranges"></div>
  </div>
  <div class="drill-run drill-panel">
    <div class="drill-progress"></div>
    <div class="drill-prompt">
      <span class="drill-label">Suomi</span>
      <span class="drill-prompt-text"></span>
    </div>
    <div class="drill-input-row">
      <input type="text" class="drill-answer" autocomplete="off" spellcheck="false"
             placeholder="infinitiivi  Präsens  Präteritum  Perfekt" />
    </div>
    <div class="drill-feedback-space" aria-live="polite">
      <div class="drill-feedback drill-hidden"></div>
    </div>
    <div class="drill-actions">
      <button type="button" class="drill-submit primary">Tarkista</button>
      <button type="button" class="drill-stop danger">Lopeta harjoitus</button>
    </div>
  </div>
  <div class="drill-done drill-panel">
    <div class="drill-summary">
      <h4>Yhteenveto</h4>
      <div class="drill-summary-text"></div>
    </div>
    <div class="drill-actions">
      <button type="button" class="drill-restart">Valitse uusi väli</button>
      <button type="button" class="drill-download-log" hidden>Lataa loki (CSV)</button>
    </div>
    <p class="drill-log-note" hidden>Lataa harjoitusloki painikkeesta harjoituksen jälkeen (CSV, päivämäärä ja kellonaika tiedostonimessä).</p>
  </div>
</div>
